name: npm maintenance (deprecate)

# Registry maintenance: mark a published version deprecated so installers see the
# message. Uses the repo's NPM_TOKEN. Manual-only; deprecation is loud but reversible
# (deprecate with an empty message to undo).
on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package (e.g. @agentcreds/sdk)"
        required: true
      version:
        description: "Exact version to deprecate"
        required: true
      message:
        description: "Deprecation message shown to installers"
        required: true

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm deprecate "${{ inputs.package }}@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
