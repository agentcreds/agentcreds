name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel a superseded in-flight run on the same ref so rapid pushes/PR updates
# don't stack up and burn Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# CROSS-PLATFORM MATRIX, and how to switch it off per repo.
#
# Three jobs below (core, python, node) build on Linux + macOS + Windows. On a PRIVATE
# repo those runners bill at 10x (macOS) and 2x (Windows), which exhausts a free plan's
# monthly minutes in a couple of runs. Set the repo variable CI_LINUX_ONLY=true to
# collapse all three matrices to ubuntu-latest:
#
#   gh variable set CI_LINUX_ONLY -b true -R <org>/<repo>
#
# The default is the FULL matrix, deliberately: an unconfigured repo - including the
# public one and every fork - gets complete coverage, and only a repo that explicitly
# opts in pays less. Do NOT invert this. Two things stop running under CI_LINUX_ONLY:
# the macOS/Windows wheel and native-addon builds, and the napi Rust-level binding
# tests, which are Windows-only for the linker reason documented on that step.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check (all crates)
        run: |
          set +e
          fail=0
          for d in . agentcreds-py agentcreds-node; do
            echo "== fmt: $d =="
            (cd "$d" && cargo fmt --check) || fail=1
          done
          exit $fail

  coverage:
    name: coverage ratchet (core)
    runs-on: ubuntu-latest
    # RATCHET: fail the build if core coverage regresses below the baseline.
    # Bump the floors UP as coverage improves; never lower them.
    defaults:
      run:
        working-directory: agentcreds-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Enforce core coverage floor (default + sd-jwt)
        run: cargo llvm-cov --features sd-jwt --summary-only --fail-under-lines 90 --fail-under-functions 81

  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full matrix by default; ubuntu-only where CI_LINUX_ONLY=true (see header).
        os: ${{ vars.CI_LINUX_ONLY == 'true'
             && fromJSON('["ubuntu-latest"]')
             || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    defaults:
      run:
        working-directory: agentcreds-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Unit, integration and doc tests
        run: cargo test
      - name: Adversarial-input fuzz suite (proptest)
        run: cargo test --features proptest --test fuzz_malformed_input
      - name: Property suite - attenuation/verification invariants (proptest)
        run: cargo test --features proptest --lib proptest_tests
      - name: Clippy
        run: cargo clippy --all-targets

  core-all-features:
    name: core / all features (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcreds-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check all features
        run: cargo check --all-features

  python:
    name: python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full matrix by default; ubuntu-only where CI_LINUX_ONLY=true (see header).
        os: ${{ vars.CI_LINUX_ONLY == 'true'
             && fromJSON('["ubuntu-latest"]')
             || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    defaults:
      run:
        working-directory: agentcreds-py
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentcreds-py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          pip install maturin
          maturin build --release --out dist
      - name: Install wheel and run quickstart smoke test
        shell: bash
        run: |
          pip install dist/*.whl
          python examples/quickstart.py
      - name: Cross-language conformance (verify shared golden vectors)
        run: python tests/test_conformance.py

  node:
    name: node / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full matrix by default; ubuntu-only where CI_LINUX_ONLY=true (see header).
        os: ${{ vars.CI_LINUX_ONLY == 'true'
             && fromJSON('["ubuntu-latest"]')
             || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    defaults:
      run:
        working-directory: agentcreds-node
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentcreds-node
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      # napi cdylib crates can't link a standalone `cargo test` binary on Linux/macOS
      # (the `napi_*` symbols are provided by the Node host at load time; Windows
      # resolves them via a delay-load .lib). Run the Rust-level unit tests on Windows;
      # all platforms still build the addon and run the JS smoke test below.
      - name: Rust-level binding tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test
      - name: Build native addon
        run: |
          npm install
          npm run build:debug
      - name: Run quickstart smoke test
        run: node examples/quickstart.js
      - name: Cross-language conformance (verify shared golden vectors)
        run: node --test test/conformance.test.js

  runtime:
    name: python runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agentcreds-py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and install the agentcreds wheel
        working-directory: agentcreds-py
        run: |
          pip install maturin
          maturin build --release --out dist
          pip install dist/*.whl
      - name: Install agentcreds-runtime and run its test suite
        working-directory: agentcreds-runtime
        run: |
          pip install -e ".[test]"
          pytest -q
      - name: Run the end-to-end enforcement example
        working-directory: agentcreds-runtime
        run: python examples/enforce_loop.py

  bbs:
    name: bbs+ selective disclosure (feature)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcreds-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test the BBS+ feature (arkworks / BLS12-381)
        run: cargo test --features bbs
      - name: Clippy (bbs)
        run: cargo clippy --features bbs --all-targets

  deny:
    name: cargo-deny (sdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@cargo-deny
      # Supply-chain gate: RustSec advisories, license policy (keeps copyleft out
      # of the SDK), banned/duplicate crates, and crate sources. Config: deny.toml.
      - name: cargo-deny (advisories, licenses, bans, sources)
        run: cargo deny --manifest-path Cargo.toml --config deny.toml check

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # `--locked` checks the committed lockfile, so this fails if a dependency
      # raises its MSRV above ours - the signal to bump the declaration (or pin down).
      - name: cargo check on MSRV
        run: cargo check --locked --manifest-path Cargo.toml

  docs:
    name: docs (rustdoc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentcreds-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # Build the hosted API docs with all features and fail on any broken
      # intra-doc link (the docs.rs config renders the bbs module too).
      - name: cargo doc (deny broken links)
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: cargo doc --no-deps --all-features
