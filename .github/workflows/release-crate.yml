name: Release (crates.io)

# Publishes the Rust crates to crates.io. Trigger by pushing a tag like `v0.1.0`.
# Requires a publish-scoped CARGO_REGISTRY_TOKEN secret on this repo.
#
# `agentcreds-resolvers` depends on `agentcreds-core`, so core is published first;
# crates.io needs a moment to index it before the dependent publish succeeds, hence
# the retry loop.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Keyless build provenance (added 2026-09-06, matching the other release workflows).
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the crates build and test
        run: cargo test -p agentcreds-core --locked

      # `cargo package` writes target/package/<name>-<version>.crate - a documented,
      # stable contract. `cargo publish --dry-run` no longer leaves the archive there
      # (modern cargo stages it in a temp dir and cleans up), which broke this step's
      # original form twice. Packaging is deterministic for a given tree, so the file
      # attested here is byte-identical to what the publish step re-packages and
      # uploads. crates.io does not ingest attestations yet; verification is via
      # GitHub (`gh attestation verify <file>.crate --repo <owner>/<repo>`).
      # Attested BEFORE publish so no uploaded artifact is ever unattested.
      - name: Package for attestation
        run: cargo package -p agentcreds-core --locked
      # An explicit path, not a glob: the attest action's glob resolution failed to
      # match target/package/*.crate on a run where the file demonstrably existed
      # (the dry-run's verify step had just compiled from it). The copy also fails
      # with a readable shell error if packaging ever stops producing the file.
      - name: Stage the crate for attestation
        run: cp target/package/agentcreds-core-*.crate agentcreds-core.crate
      - name: Attest build provenance (core)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: agentcreds-core.crate

      - name: Publish agentcreds-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p agentcreds-core --locked
      - name: Publish agentcreds-resolvers (retry until core is indexed)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cargo publish -p agentcreds-resolvers --locked; then
              exit 0
            fi
            echo "resolvers publish failed (attempt $attempt) - core may not be indexed yet; retrying in 30s"
            sleep 30
          done
          echo "::error::agentcreds-resolvers failed to publish after retries"
          exit 1
