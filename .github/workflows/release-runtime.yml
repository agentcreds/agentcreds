name: Release (runtimes)

# Publishes the pure-language runtime packages:
#   - agentcreds-runtime      -> PyPI  (Python MCP middleware)   on tag `runtime-v*`
#   - @agentcreds/runtime     -> npm   (Node A2A runtime)        on tag `runtime-node-v*`
# Python uses PyPI Trusted Publishing (OIDC); Node uses provenance + NPM_TOKEN.
on:
  push:
    tags: ["runtime-v*", "runtime-node-v*"]
  workflow_dispatch:

jobs:
  pypi:
    name: agentcreds-runtime -> PyPI
    if: startsWith(github.ref, 'refs/tags/runtime-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: agentcreds-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build --outdir dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agentcreds-runtime/dist

  npm:
    name: "@agentcreds/runtime -> npm"
    if: startsWith(github.ref, 'refs/tags/runtime-node-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: agentcreds-runtime-node
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Build
        run: |
          npm install
          npm run build --if-present
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
