[package]
name = "agentcreds-node"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Node.js bindings for agentcreds-core - verifiable, attenuable delegation for AI agents, verified offline"
license = "Apache-2.0"
repository = "https://github.com/agentcreds/agentcreds"
publish = false

[lib]
name = "agentcreds_node"
crate-type = ["cdylib"]

[dependencies]
# The FFI SDK exposes SD-JWT to consumers, so it opts back into the now-default-off
# `sd-jwt` interop feature (the pure-Rust core default build omits it).
agentcreds-core = { path = "../agentcreds-core", features = ["sd-jwt"] }
napi = { version = "2", default-features = false, features = ["napi4", "chrono_date", "serde-json"] }
napi-derive = "2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
