[package]
name = "agentcreds-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Python bindings for agentcreds-core - verifiable, attenuable delegation for AI agents, verified offline"
license = "Apache-2.0"
repository = "https://github.com/agentcreds/agentcreds"
publish = false

[lib]
name = "agentcreds"
crate-type = ["cdylib"]

[dependencies]
# The FFI SDK exposes SD-JWT to consumers, so it opts back into the now-default-off
# `sd-jwt` interop feature (the pure-Rust core default build omits it).
agentcreds-core = { path = "../agentcreds-core", features = ["sd-jwt"] }
pyo3 = { version = "0.22", features = ["extension-module", "chrono", "abi3-py38"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
